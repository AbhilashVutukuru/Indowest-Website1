<header class="site-header" [class.scrolled]="scrolled">
  <div class="iw-wrap">
    <div class="header-bar">
      <!-- Brand Logo -->
      <a routerLink="/home" class="brand" (click)="closeMenu()" aria-label="IndoWest United home">
        <img src="./assets/darkTheme.png" alt="Indowest United" class="brand-logo-img" />
      </a>

      <!-- Navigation -->
      <nav class="main-nav" [class.show]="menuOpen" aria-label="Main navigation">
        <a routerLink="/home" routerLinkActive="active-route" class="nav-link"
           [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
        <a routerLink="/about" routerLinkActive="active-route" class="nav-link" (click)="closeMenu()">About</a>
        <a routerLink="/services" routerLinkActive="active-route" class="nav-link" (click)="closeMenu()">Services</a>
        <a routerLink="/business-models" routerLinkActive="active-route" class="nav-link" (click)="closeMenu()">Business Models</a>
        <a routerLink="/products" routerLinkActive="active-route" class="nav-link" (click)="closeMenu()">Products</a>
        <a routerLink="/contact" routerLinkActive="active-route" class="nav-link" (click)="closeMenu()">Contact</a>

        <div class="nav-meta">
          <span>EST. 2015</span>
          <a href="tel:+917901666696">+91 7901666696</a>
        </div>
      </nav>

      <!-- CTA + mobile toggle -->
      <div class="header-cta">
        <a class="iw-btn primary sm" routerLink="/contact" (click)="closeMenu()">
          Get in Touch <i class="fas fa-arrow-up-right-from-square"></i>
        </a>
        <button class="navbar-toggler" type="button" (click)="toggleMenu()" aria-label="Toggle navigation">
          <i class="fas" [class.fa-bars]="!menuOpen" [class.fa-xmark]="menuOpen"></i>
        </button>
      </div>
    </div>
  </div>
</header>
